<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Trailhead — UI Review Toolkit demo</title>
<style>
:root{color-scheme:light;font:16px/1.55 system-ui,sans-serif;background:#f5f5f0;color:#1c2922}
body{margin:0 auto;padding:clamp(1.5rem,6vw,5rem);max-width:48rem}
small{letter-spacing:.12em;text-transform:uppercase;color:#395a4b}
h1{font-size:clamp(2.3rem,7vw,4.5rem);line-height:1.05;letter-spacing:-.045em;margin:.5rem 0}
.intro{max-width:37rem;margin:1rem 0 2rem;color:#405047}
article{background:white;border:1px solid #d7dfd6;border-radius:1rem;padding:1.25rem 1.5rem;margin:1rem 0}
h2{margin:0}button{color:#fff;background:#28543e;border:0;border-radius:.6rem;padding:.8rem 1rem;font:inherit;cursor:pointer}
</style>
</head>
<body>
<main>
  <small>Sample preview</small>
  <h1>Plan a trail day</h1>
  <p id="intro" class="intro">Pick an element or select some text to leave a note. This sample page contains only fictional content.</p>
  <article id="stable-card"><h2>North Loop</h2><p>2.4 miles · Moderate · Starts at the visitor center.</p><button id="fixture-action" type="button">View trail details</button></article>
  <article id="route-card"><h2>River Walk</h2><p>1.1 miles · Easy · Follows the river and returns to the trailhead.</p></article>
</main>

</body>
